version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartmetrix_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - BASE_URL=http://localhost:5000
      - JWT_SECRET=4212ce9da97a67c3d8d1a03592332919da0f100c56fc3c699934e096e013f497752b280128adfde553461bf301aa11f410b5b021e49f88c2bc4d5e46cb1d1cae
      - CORS_ORIGIN=*
      - NODE_ENV=production
    volumes:
      - ./backend/db:/app/db
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./smartmetrix
      dockerfile: Dockerfile
    container_name: smartmetrix_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
